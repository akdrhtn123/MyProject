# 로컬 kind 클러스터용 설정. 배포: kubectl --context kind-myproject apply -k k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 생성되는 ConfigMap·Secret 도 같은 네임스페이스여야 Deployment 의 참조 이름에 해시가 붙는다
namespace: myproject

resources:
  - ../../base

# up.sh 가 빌드해서 kind load 로 넣는 이미지
images:
  - name: myproject/be
    newTag: dev
  - name: myproject/fe
    newTag: dev

# 이름 뒤에 내용 해시가 붙는다 (be-config-5f7c...). 값을 바꾸면 이름이 바뀌어 Pod 가 새로 뜬다
configMapGenerator:
  - name: be-config
    literals:
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost"]
      - FRONTEND_URL=http://localhost
      - DEFAULT_MODEL=fake:echo
      - CREDITS_ENFORCED=true
      - ALLOW_SIGNUP=true
      - ADMIN_EMAILS=[]

# secret.env 는 커밋하지 않는다 (up.sh 가 없으면 만든다. 형식은 secret.env.example)
secretGenerator:
  - name: app-secrets
    envs:
      - secret.env

# 호스트에서 접속하도록 Service 를 NodePort 로 (kind-cluster.yaml 의 포트 연결과 짝)
patches:
  - target: { kind: Service, name: fe }
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target: { kind: Service, name: be }
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
