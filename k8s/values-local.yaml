# 로컬 kind 클러스터용 값. chart/values.yaml 위에 덮어쓴다
#   helm upgrade --install myproject k8s/chart --kube-context kind-myproject -n myproject -f k8s/values-local.yaml

be:
  # up.sh 가 빌드해서 kind load 로 노드에 넣는 이미지 (레지스트리 없이)
  image: { tag: dev }
  # 호스트에서 접속하도록 NodePort 로 (kind-cluster.yaml 의 포트 연결과 짝)
  service: { type: NodePort, nodePort: 30081 }
  config:
    CORS_ORIGINS: '["http://localhost"]'
    FRONTEND_URL: http://localhost

fe:
  image: { tag: dev }
  service: { type: NodePort, nodePort: 30080 }
