# 로컬 kind 클러스터용 값. chart/values.yaml 위에 덮어쓴다
#   helm upgrade --install myproject k8s/chart --kube-context kind-myproject -n myproject -f k8s/values-local.yaml

be:
  replicas: 2 # worker 노드 2대에 하나씩 퍼지는지 확인용
  # up.sh 가 빌드해서 kind load 로 노드에 넣는 이미지 (레지스트리 없이)
  image: { tag: dev }
  config:
    CORS_ORIGINS: '["http://localhost"]'
    FRONTEND_URL: http://localhost

fe:
  image: { tag: dev }

# localhost:80 → NodePort 30080 → Envoy → be / fe (kind-gateway.yaml 의 GatewayClass envoy)
gateway:
  enabled: true
  className: envoy
