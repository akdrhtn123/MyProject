apiVersion: v1
kind: ConfigMap
metadata:
  name: be-config
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.be.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.be.replicas }}
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
      annotations:
        # ConfigMap 은 바뀌어도 Pod 가 알아서 재시작되지 않는다. 내용 해시를 넣어 값이 바뀌면 새로 뜨게 한다
        checksum/config: {{ .Values.be.config | toJson | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # k8s 에는 depends_on 이 없다. DB 가 받을 준비가 될 때까지 기다렸다가 앱을 띄운다
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -U agent; do sleep 2; done"]
      containers:
        - name: be
          image: {{ include "myproject.image" (list .Values.be.image "be") }}
          imagePullPolicy: {{ .Values.be.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: be-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD }
            # $(VAR) 는 같은 목록에서 먼저 정의한 env 로 치환된다
            - name: DATABASE_URL
              value: postgresql+asyncpg://agent:$(POSTGRES_PASSWORD)@postgres:5432/agent
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: JWT_SECRET }
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: ENCRYPTION_KEY }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: ANTHROPIC_API_KEY, optional: true }
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: OPENAI_API_KEY, optional: true }
          readinessProbe: # 실패하면 Service 트래픽에서 빠진다
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe: # 실패하면 컨테이너를 재시작한다
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.be.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: be
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
spec:
  selector:
    app: be
  {{- include "myproject.servicePorts" .Values.be.service | nindent 2 }}
