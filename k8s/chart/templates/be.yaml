apiVersion: v1
kind: ConfigMap
metadata:
  name: be-config
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.be.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  # 서버 여러 개가 동시에 마이그레이션하지 않도록 끈다 (Job 이 한다)
  MIGRATE_ON_STARTUP: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.be.replicas }}
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
      annotations:
        # ConfigMap 은 바뀌어도 Pod 가 알아서 재시작되지 않는다. 내용 해시를 넣어 값이 바뀌면 새로 뜨게 한다
        checksum/config: {{ .Values.be.config | toJson | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 마이그레이션은 Job(be-migrate.yaml)이 한 번만 돌린다. 서버는 DB 가 이 이미지의 최신 스키마가 될 때까지 기다렸다가 뜬다
      initContainers:
        - name: wait-migration
          image: {{ include "myproject.image" (list .Values.be.image "be") }}
          imagePullPolicy: {{ .Values.be.image.pullPolicy }}
          command: ["sh", "-c", "until python -m be_agent.db.migrate --check; do sleep 3; done"]
          {{- include "myproject.beEnv" . | nindent 10 }}
      containers:
        - name: be
          image: {{ include "myproject.image" (list .Values.be.image "be") }}
          imagePullPolicy: {{ .Values.be.image.pullPolicy }}
          ports:
            - containerPort: 8000
          {{- include "myproject.beEnv" . | nindent 10 }}
          readinessProbe: # 실패하면 Service 트래픽에서 빠진다
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe: # 실패하면 컨테이너를 재시작한다
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.be.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: be
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
spec:
  selector:
    app: be
  {{- include "myproject.servicePorts" .Values.be.service | nindent 2 }}
