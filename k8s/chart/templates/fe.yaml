apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.fe.replicas }}
  selector:
    matchLabels:
      app: fe
  template:
    metadata:
      labels:
        app: fe
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fe
          image: {{ include "myproject.image" (list .Values.fe.image "fe") }}
          imagePullPolicy: {{ .Values.fe.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            # 서버(BFF)가 클러스터 내부 DNS 로 백엔드를 부른다
            - name: BACKEND_URL
              value: http://be:{{ .Values.be.service.port }}
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /login, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.fe.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fe
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
spec:
  selector:
    app: fe
  {{- include "myproject.servicePorts" .Values.fe.service | nindent 2 }}
