{{- /* 도메인 하나로 받아 /api/v1 · /docs → be, 나머지 → fe 로 나눈다 (Gateway API). 컨트롤러(GatewayClass)는 클러스터가 준다 */ -}}
{{- if .Values.gateway.enabled }}
{{- $hostname := .Values.gateway.hostname }}
{{- if not .Values.gateway.existing }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: myproject
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ required "gateway.className 을 지정하세요 (kubectl get gatewayclass)" .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      {{- with $hostname }}
      hostname: {{ . | quote }}
      {{- end }}
    {{- with .Values.gateway.tls.secretName }}
    - name: https
      protocol: HTTPS
      port: 443
      {{- with $hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ . }}
    {{- end }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myproject
  labels:
    {{- include "myproject.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- with .Values.gateway.existing }}
    # 클러스터 공용 Gateway 에 붙는다. 그 Gateway 의 allowedRoutes 가 이 네임스페이스를 허용해야 한다
    - name: {{ .name }}
      namespace: {{ .namespace }}
    {{- else }}
    - name: myproject
    {{- end }}
  {{- with $hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    # 백엔드: 외부 API(API 키)와 API 문서. 프론트의 BFF 는 /api/backend 라 겹치지 않는다
    - matches:
        - path: { type: PathPrefix, value: /api/v1 }
        - path: { type: Exact, value: /docs }
        - path: { type: Exact, value: /openapi.json }
      backendRefs:
        - name: be
          port: {{ .Values.be.service.port }}
      # 대화 응답은 SSE 로 길게 이어지므로 요청 시간 제한을 끈다 ("0s" = 제한 없음)
      timeouts:
        request: "0s"
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: fe
          port: {{ .Values.fe.service.port }}
      timeouts:
        request: "0s"
{{- end }}
